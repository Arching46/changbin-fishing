<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彰濱磯釣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed live 3D sea; HUD pinned to the edges; sheets rise from the bottom on phones and float centered on desktop. Night-harbour palette: deep tide navy, sea-glass teal, buoy amber/coral. */
:root{
  --ink:#06131e; --deep:#0a1c2a; --panel:rgba(8,24,36,.84); --solid:#0d2131; --raise:#13304a; --line:#23465f; --line2:#2e5a78;
  --fg:#e9f2f5; --mute:#90abbb; --tide:#38d6c6; --tide-2:#1fae9f; --tide-ink:#032621; --amber:#ffb447; --coral:#ff6450;
  --good:#61d98d; --warn:#ffd04a; --bad:#ff5d4d;
  --f-disp:'LXGW WenKai TC','Noto Serif TC','Songti TC',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-data:'Chakra Petch','Noto Sans TC',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--tide);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(130% 90% at 50% 0%,#14354d 0%,var(--ink) 70%)}
#stage{position:absolute;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:600 11px/1 var(--f-body);color:#fff;background:rgba(5,16,26,.72);border:1px solid rgba(255,255,255,.18);padding:4px 7px;border-radius:999px;transform:translate(-50%,-100%)}
.tag.town{background:none;border:0;font:700 14px var(--f-disp);color:#f3e7cf;text-shadow:0 1px 4px #000}
.tag.road{background:#3a3226;border-color:#6b5a3e;color:#ffd99a;font:700 10px var(--f-data)}
.tag.zone{background:none;border:0;color:#cfe2ea;font:500 12px var(--f-body);letter-spacing:.12em;text-shadow:0 1px 3px #000;opacity:.85}
.pin{position:absolute;left:0;top:0;pointer-events:auto;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px}
.pin b{display:flex;align-items:center;gap:6px;background:var(--solid);border:1.5px solid var(--tide);color:var(--fg);font:700 13px var(--f-disp);padding:6px 10px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.pin b em{font:700 10px var(--f-data);font-style:normal;background:var(--tide);color:var(--tide-ink);border-radius:999px;padding:2px 6px}
.pin i{width:2px;height:16px;background:linear-gradient(var(--tide),transparent)}
.pin.on b{background:var(--tide);color:var(--tide-ink)}
.pin.shop b{border-color:var(--amber)}
.pin.shop b em{background:var(--amber)}

.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand h1{margin:0;font:700 26px/1.05 var(--f-disp);letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.brand p{margin:3px 0 0;font:500 12px var(--f-body);color:var(--mute);letter-spacing:.14em}
.where{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;backdrop-filter:blur(10px);min-width:0;max-width:56vw}
.where h2{margin:0;font:700 18px/1.15 var(--f-disp)}
.where p{margin:3px 0 0;font:600 11px/1.35 var(--f-data);color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:60vw}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:600 12px/1.2 var(--f-data);white-space:nowrap;backdrop-filter:blur(10px);font-variant-numeric:tabular-nums}
.chip.money{color:var(--amber);border-color:#5b4626}
.chip.btn{cursor:pointer}
#feed{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 78px);display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:70vw}
#feed div{font:500 12px var(--f-body);background:rgba(5,16,26,.66);border-left:3px solid var(--amber);padding:4px 8px;border-radius:0 8px 8px 0;animation:fin .3s ease-out}
@keyframes fin{from{opacity:0;transform:translateX(-8px)}}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);background:rgba(4,14,22,.92);border:1px solid var(--line2);color:var(--fg);padding:10px 16px;border-radius:14px;font:500 14px/1.4 var(--f-body);max-width:min(90vw,460px);text-align:center;pointer-events:none;z-index:30}
#callout{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font:700 44px var(--f-disp);color:var(--warn);text-shadow:0 0 20px rgba(255,180,60,.6),0 3px 0 #3a2400;pointer-events:none;white-space:nowrap;animation:pop .35s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}

.dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.dock>*{pointer-events:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.ibtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;height:54px;padding:6px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:500 11px var(--f-body);color:var(--mute);backdrop-filter:blur(10px)}
.ibtn svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:scale(.96)}
.ibtn.on{border-color:var(--amber);background:#2a1f0e;color:#ffc977}
.ibtn .n{font:700 10px var(--f-data);color:var(--amber)}
.acts{display:grid;grid-template-columns:1.65fr 1fr;gap:10px}
.pbtn{height:70px;border-radius:18px;background:linear-gradient(180deg,#4ae6d5,#1fae9f);color:var(--tide-ink);font:700 21px/1.1 var(--f-disp);box-shadow:0 8px 24px rgba(56,214,198,.28),inset 0 1px 0 rgba(255,255,255,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
.pbtn small{font:500 11px var(--f-body);opacity:.78}
.pbtn.hot{background:linear-gradient(180deg,#ffd978,#ff9f2e);color:#2c1700;box-shadow:0 0 0 3px rgba(255,190,80,.35),0 8px 26px rgba(255,160,40,.45);animation:throb .5s ease-in-out infinite alternate}
.pbtn.hold{background:linear-gradient(180deg,#7cf0e3,#2fc4b4)}
.pbtn:disabled{opacity:.45}
@keyframes throb{to{transform:scale(1.03)}}
.crow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px}
.cbtn{height:52px;border-radius:12px;background:#0b2232;border:1px solid var(--line2);font:600 13px/1.2 var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
.cbtn small{font:500 10px var(--f-body);color:var(--mute)}
.cbtn.hot{background:linear-gradient(180deg,#ffd06e,#f0952c);color:#2c1700;border:0}
.cbtn.hot small{color:#5a3606}
.cbtn.on{background:#ffe7a8;color:#2c1700}
.acts.three{grid-template-columns:1.35fr 1fr 1fr}
.sbtn{height:70px;border-radius:18px;background:var(--panel);border:1px solid var(--line2);font:600 15px/1.2 var(--f-body);touch-action:none;backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sbtn small{font:500 10px var(--f-body);color:var(--mute)}
.sbtn.hold{background:var(--raise);border-color:var(--amber)}
.sbtn:disabled{opacity:.38}
.status{font:500 13px/1.4 var(--f-body);color:var(--fg);text-align:center;text-shadow:0 1px 4px #000;min-height:18px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:7px;backdrop-filter:blur(10px)}
.mrow{display:grid;grid-template-columns:52px 1fr 64px;gap:8px;align-items:center;font:600 11px var(--f-data);color:var(--mute);font-variant-numeric:tabular-nums}
.mrow span:last-child{text-align:right;color:var(--fg)}
.bar{height:11px;border-radius:6px;background:#06121b;border:1px solid #1b3446;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--tide);border-radius:5px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.85}
.bar.pow i{background:linear-gradient(90deg,#2fc4b4,#ffd04a,#ff6450)}
.mapcard{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:14px;backdrop-filter:blur(12px);display:grid;gap:10px;max-width:560px}
.mapcard h3{margin:0;font:700 22px/1.1 var(--f-disp)}
.mapcard h3 small{font:500 12px var(--f-body);color:var(--mute);margin-left:8px;letter-spacing:.08em}
.mapcard p{margin:0;font:400 13px/1.6 var(--f-body);color:#cfe0e8;max-width:62ch}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{font:600 11px/1 var(--f-data);background:#0b2232;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--mute)}
.kv span b{color:var(--fg);font-weight:600;margin-left:4px}
.row2{display:flex;gap:8px}
.go{flex:1;height:50px;border-radius:14px;background:linear-gradient(180deg,#4ae6d5,#1fae9f);color:var(--tide-ink);font:700 18px var(--f-disp)}
.ghost{height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:#0b2232;font:600 14px var(--f-body)}
.hint{font:500 12px var(--f-body);color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:560px}

#uwWrap{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:var(--dockH,190px);width:132px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#061521;box-shadow:0 10px 26px rgba(0,0,0,.5)}
#uwWrap header{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font:600 10px var(--f-data);color:var(--mute);letter-spacing:.06em;background:#0a1e2c}
#uwWrap header button{font:700 11px var(--f-data);color:var(--tide)}
#uw{display:block;width:100%;height:178px}
#uwWrap.min #uw{display:none}
#aimHint{position:absolute;left:50%;bottom:calc(var(--dockH,190px) + 6px);transform:translateX(-50%);font:500 12px var(--f-body);color:#d9eaf0;background:rgba(5,16,26,.6);padding:5px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}

/* sheets */
#sheet{position:absolute;inset:0;background:rgba(2,9,15,.62);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sc{position:relative;width:100%;max-height:90%;background:var(--deep);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.banner{position:relative;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(6,19,30,.15),rgba(10,28,42,1)),linear-gradient(100deg,#0f3a52 0%,#13304a 45%,#3a2b32 75%,#7a4630 100%);overflow:hidden;flex:none}
.banner svg.bg{position:absolute;right:0;bottom:0;height:100%;width:auto;opacity:.5;pointer-events:none}
.banner .kick{display:inline-block;font:700 10px var(--f-data);letter-spacing:.12em;color:var(--tide);border:1px solid rgba(56,214,198,.5);border-radius:999px;padding:3px 9px;background:rgba(3,30,30,.5)}
.banner h2{margin:8px 0 2px;font:700 24px/1.15 var(--f-disp);position:relative}
.banner p{margin:0;font:400 12px/1.5 var(--f-body);color:#bcd2dc;position:relative;max-width:60ch}
.banner .x{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;background:rgba(5,16,26,.6);border:1px solid var(--line);font:400 22px/1 var(--f-body);display:flex;align-items:center;justify-content:center;z-index:2}
.cur{display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));flex:none;scrollbar-width:none}
.cur::-webkit-scrollbar{display:none}
.cur span{flex:none;font:600 11px var(--f-body);padding:5px 9px;border-radius:8px;border:1px solid;white-space:nowrap}
.cur span:nth-child(4n+1){color:#7fe7dc;border-color:#22655f;background:#0b2a2a}
.cur span:nth-child(4n+2){color:#ffc977;border-color:#6b4d22;background:#2a1f0e}
.cur span:nth-child(4n+3){color:#ff9c8f;border-color:#6d2c27;background:#2a1210}
.cur span:nth-child(4n){color:#b9c7ff;border-color:#34407a;background:#141a33}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:12px 12px 10px;font:600 14px var(--f-body);color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--tide)}
.subs{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));flex:none;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.sub{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#0b2232;font:500 13px var(--f-body);color:#c4d6df;white-space:nowrap}
.sub.on{background:var(--tide);border-color:var(--tide);color:var(--tide-ink);font-weight:700}
.sb{overflow-y:auto;overscroll-behavior:contain;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.gh{margin:16px 0 6px;font:700 13px var(--f-body);color:var(--tide);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.gh::after{content:"";flex:1;height:1px;background:var(--line)}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid #17334a}
.it h4{margin:0;font:600 15px/1.3 var(--f-body)}
.it h4 small{font:500 11px var(--f-data);color:var(--mute);margin-left:6px}
.it p{margin:2px 0 0;font:400 12px/1.5 var(--f-body);color:var(--mute)}
.specs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.specs span{font:600 10.5px/1 var(--f-data);color:#c8dae3;background:#0b2232;border:1px solid #1c3c52;border-radius:6px;padding:4px 6px}
.buy{min-width:84px;height:40px;border-radius:12px;background:#0f3442;border:1px solid #2a6e74;color:#9df1e6;font:700 13px var(--f-data);padding:0 10px}
.buy:disabled{opacity:.45}
.buy.eq{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.buy.warn{background:#3a1c18;border-color:#7a3b31;color:#ffb3a6}
.owned{font:600 11px var(--f-data);color:var(--good)}
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.fcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(160deg,#10283a,#0b1d2b);display:grid;gap:6px}
.fcard.on{border-color:var(--tide);box-shadow:0 0 0 1px var(--tide),0 0 22px rgba(56,214,198,.18)}
.fcard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard .hd b{font:700 17px var(--f-disp)}
.fcard .hd span{font:700 10px var(--f-body);padding:3px 8px;border-radius:6px;border:1px solid}
.fcard p{margin:0;font:400 12px/1.55 var(--f-body);color:#bcd0da}
.st{display:flex;justify-content:space-between;font:500 12px var(--f-body);color:var(--mute);border-top:1px dashed #1e3a50;padding-top:5px}
.st b{font:700 12px var(--f-data)}
.sizes{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.sizes button{padding:6px 9px;border-radius:9px;border:1px solid #2a5068;background:#0b2232;font:600 12px var(--f-data);color:#cfe1ea}
.sizes button.on{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
.sizes button.have{border-color:#3c8a62;color:#a8f0c4}
.sizes button:disabled{opacity:.4}
.rig{display:grid;gap:0;margin-top:4px}
.rr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%;padding:0 0 0 0;min-height:58px}
.rr .ic{align-self:stretch;display:flex;align-items:center;justify-content:center;position:relative}
.rr .ic::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:#7fb6cf;opacity:.55;transform:translateX(-50%)}
.rr.leader .ic::before{background:#7be3a2}
.rr:first-child .ic::before{top:50%}
.rr:last-child .ic::before{bottom:50%}
.rr .ic svg{position:relative;width:34px;height:34px}
.rr .tx{padding:9px 0;border-bottom:1px solid #17334a;min-width:0}
.rr .tx small{display:block;font:600 10px var(--f-data);color:var(--mute);letter-spacing:.08em}
.rr .tx b{display:block;font:600 14px/1.35 var(--f-body)}
.rr .tx i{display:block;font:500 11px/1.4 var(--f-data);color:#9fbccb;font-style:normal}
.rr .tx b.miss{color:var(--bad)}
.rr .ar{color:var(--mute);font:600 18px var(--f-data);padding-right:4px}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 4px}
.sum div{background:#0b2232;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.sum small{display:block;font:600 10px var(--f-body);color:var(--mute);letter-spacing:.06em}
.sum b{font:700 18px var(--f-data);font-variant-numeric:tabular-nums}
.sum em{font:500 11px var(--f-body);font-style:normal;color:var(--mute);margin-left:4px}
.msgs{display:grid;gap:5px;margin:8px 0}
.msgs div{font:500 12px/1.45 var(--f-body);padding:7px 10px;border-radius:10px}
.msgs .e{background:#3a1512;color:#ffb5a9;border:1px solid #6e2b24}
.msgs .w{background:#33280f;color:#ffdc8f;border:1px solid #6a5321}
.msgs .ok{background:#0f2e22;color:#9df0bf;border:1px solid #23674a}
.slider{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid #17334a}
.slider .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slider .lab b{font:600 15px var(--f-body)}
.slider .lab span{font:700 22px var(--f-data);color:var(--tide);font-variant-numeric:tabular-nums}
.slider p{margin:0;font:400 12px/1.5 var(--f-body);color:var(--mute)}
.stp{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}
.stp button{height:44px;border-radius:12px;background:#0f3442;border:1px solid #2a6e74;font:700 20px var(--f-data);color:#9df1e6}
.stp input{width:100%;accent-color:var(--tide)}
.fishcard{display:grid;gap:10px;justify-items:center;text-align:center;padding:10px 0}
.fishcard h3{margin:0;font:700 30px var(--f-disp)}
.fishcard .big{font:700 44px var(--f-data);color:var(--amber);font-variant-numeric:tabular-nums}
.fishcard .big small{font-size:18px;color:var(--mute);margin-left:4px}
.fishcard svg{width:min(320px,80%);height:auto}

.empty{padding:28px 0;text-align:center;color:var(--mute);font:400 13px/1.6 var(--f-body)}

.tools .ibtn{flex:1 1 0;min-width:0}

.pin .who:empty{display:none}
.ptag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-100%);pointer-events:none}
.ptag .nm{display:flex;gap:6px;align-items:center;background:rgba(5,16,26,.8);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font:700 12px var(--f-body);color:#fff;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.ptag .nm i{font:600 10px var(--f-data);font-style:normal;color:var(--amber)}
.ptag.me .nm{border-color:var(--tide);color:#bff5ee}
.ptag.fight .nm{border-color:var(--coral)}
.ptag.fight .nm i{color:#ff9c8f}
.ptag .bub{position:relative;background:#f4f8f9;color:#0a1a24;font:600 12px/1.4 var(--f-body);padding:5px 10px;border-radius:12px;max-width:190px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:fin .25s ease-out}
.ptag .bub::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#f4f8f9;border-bottom:0}
.walk{position:absolute;top:34%;width:56px;height:76px;border-radius:18px;background:var(--panel);border:1px solid var(--line2);color:var(--fg);font:700 22px/1 var(--f-data);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.walk small{font:500 10px var(--f-body);color:var(--mute)}
.walk.l{left:max(12px,env(safe-area-inset-left,0px))}
.walk.r{right:max(12px,env(safe-area-inset-right,0px))}
.walk.on{background:var(--raise);border-color:var(--tide)}
@media (min-width:760px){

}

<script>
'use strict';
/* =========================================================
   基本工具
   ========================================================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sid=n=>String(n).replace('.','_');
const f1=n=>(Math.round(n*10)/10).toFixed(1), f2=n=>(Math.round(n*100)/100).toFixed(2);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pick=list=>{let t=0;for(const [,a] of list)t+=a;let r=Math.random()*t;for(const [k,a] of list){if((r-=a)<=0)return k}return list.length?list[list.length-1][0]:null};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* =========================================================
   釣具資料（號數、線徑、拉力依日本標準線規）
   ========================================================= */
const JP={0.6:[.128,2.5],0.8:[.148,3],1:[.165,4],1.2:[.185,5],1.5:[.205,6],1.75:[.22,7],2:[.235,8],2.5:[.26,10],3:[.285,12],3.5:[.31,14],4:[.33,16],5:[.37,20],6:[.405,24],7:[.435,28],8:[.47,32],9:[.495,36],10:[.52,40]};
const JPN=Object.keys(JP).map(Number).sort((a,b)=>a-b);
const PELB={0.6:12,0.8:14,1:18,1.2:22,1.5:25,2:32,3:45,4:55,5:70,6:80};
const KG=lb=>Math.round(lb*0.4536*10)/10;
const QIAN=3.75; // 1 錢 = 3.75 g
const IT={}; const add=o=>{IT[o.id]=o;return o};

// 磯竿
[0.6,0.8,1,1.2,1.5,1.75,2,2.5,3,4,5].forEach(no=>{
  const kg=+(2.5+no*3.4).toFixed(1), act=clamp(.78-no*.12,.12,.72), cast=Math.round(30+no*5), opt=+(4+no*3).toFixed(1);
  const lo=Math.round((no*1.2+.8)*2)/2, hi=Math.round((no*1.8+1.6)*2)/2;
  add({id:'rod_iso_'+sid(no),cat:'rod',sub:'iso',uniq:1,grp:no<1.5?'細號磯竿（0.6–1.2 號）':no<3?'中號磯竿（1.5–2.5 號）':'粗號磯竿（3–5 號）',
    n:`磯竿 ${no}號 5.3m`,p:Math.round(1200+no*1100),kg,act,cast,opt,len:5.3,lure:false,
    spec:['5.3m',`負荷 ${kg}kg`,`適用道線 ${lo}–${hi}號`,act>=.5?'軟調':act>=.3?'中調':'硬調'],
    desc:no<1.2?'細線輕標，適合黃錫鯛、沙梭、臭肚':no<2?'黑鯛、黃錫鯛萬用，新手首選':no<3?'大黑鯛、鱸魚、中型石斑':'石斑、大型鱸魚，消波塊強攻'});
});
// 路亞竿
[['ML','8ft',2.44,5.5,55,'7–21g',14,.32,'PE 0.6–1.2'],['M','9ft',2.74,7.5,64,'10–30g',20,.25,'PE 0.8–1.5'],['MH','9.6ft',2.9,10,72,'15–45g',30,.18,'PE 1–2'],['H','10ft',3.05,14,78,'20–60g',40,.12,'PE 1.5–3']].forEach(([pw,ft,len,kg,cast,lw,opt,act,pe])=>
  add({id:'rod_lure_'+pw,cat:'rod',sub:'lure',uniq:1,grp:'海水路亞竿',n:`路亞竿 ${pw} ${ft}`,p:Math.round(1500+kg*260),kg,act,cast,opt,len,lure:true,
    spec:[`${len}m`,`適用 ${lw}`,pe,`負荷 ${kg}kg`],desc:'拋投米諾、鐵板、軟蟲；配浮標釣組會拋得比較近'}));
// 捲線器 [型號, 齒輪比, 最大煞車力kg, [尼龍號, 米], 價格]
[['2500LBD',5.2,4,[2.5,150],3200],['C3000LBD',5.3,5,[3,150],4600],['3000LBD-H',6.2,6,[3,150],6200],['4000LBD',5.7,8,[4,150],9200]].forEach(([md,ra,dr,cap,p])=>
  add({id:'reel_lb_'+md,cat:'reel',sub:'lbd',uniq:1,grp:'手煞車捲線器（磯釣用）',n:`手煞車 ${md}`,p,ratio:ra,drag:dr,cap,lever:true,
    spec:[`齒輪比 ${ra}:1`,`最大煞車力 ${dr}kg`,`容線 尼龍${cap[0]}號-${cap[1]}m`,'手煞車可瞬間放線'],desc:'搏魚時扳手煞車放線，讓魚往外衝、避免貼著消波塊斷線'}));
[['2500',5.1,4,[2.5,150],1100],['C3000',5.3,5,[3,150],1500],['4000',5.3,9,[4,150],2100],['5000',5.2,10,[5,150],2900],['6000',4.9,12,[6,200],3800]].forEach(([md,ra,dr,cap,p])=>
  add({id:'reel_sp_'+md,cat:'reel',sub:'spin',uniq:1,grp:'一般紡車捲線器',n:`紡車 ${md}`,p,ratio:ra,drag:dr,cap,lever:false,
    spec:[`齒輪比 ${ra}:1`,`最大煞車力 ${dr}kg`,`容線 尼龍${cap[0]}號-${cap[1]}m`,'無手煞車'],desc:'只靠前煞車出線，價格親民，路亞與沙岸遠投都適用'}));
// 母線
[1.5,1.75,2,2.5,3,3.5,4,5,6].forEach(no=>{const [d,lb]=JP[no];
  add({id:'main_ny_'+sid(no),cat:'main',sub:'main_ny',grp:'半浮水尼龍道線 150m',n:`尼龍道線 ${no}號`,p:Math.round(160+no*70),mat:'ny',no,d,lb,kg:KG(lb),m:150,
    spec:[`${lb}lb（${KG(lb)}kg）`,`線徑 ${d}mm`,'150m','有延展'],desc:'磯釣標準道線，延展性能吸收衝擊'})});
Object.keys(PELB).map(Number).sort((a,b)=>a-b).forEach(no=>{const lb=PELB[no],d=JP[no][0];
  add({id:'main_pe_'+sid(no),cat:'main',sub:'main_pe',grp:'PE 編織線 150m',n:`PE 母線 ${no}號`,p:Math.round(300+no*130),mat:'pe',no,d,lb,kg:KG(lb),m:150,
    spec:[`${lb}lb（${KG(lb)}kg）`,`號數 ${no}`,'150m','無延展'],desc:'強度高、線細好遠投；沒有延展，衝擊大，要配子線'})});
// 子線
JPN.forEach(no=>{const [d,lb]=JP[no];
  add({id:'ld_fc_'+sid(no),cat:'leader',sub:'ld_fc',grp:'碳纖維子線 50m',n:`碳纖維子線 ${no}號`,p:Math.round(110+no*42),mat:'fc',no,d,lb,kg:KG(lb),m:50,
    spec:[`${lb}lb（${KG(lb)}kg）`,`線徑 ${d}mm`,'50m','耐磨・水中隱形'],desc:''});
  add({id:'ld_ny_'+sid(no),cat:'leader',sub:'ld_ny',grp:'尼龍子線 50m',n:`尼龍子線 ${no}號`,p:Math.round(50+no*18),mat:'ny',no,d,lb,kg:KG(lb),m:50,
    spec:[`${lb}lb（${KG(lb)}kg）`,`線徑 ${d}mm`,'50m','有彈性・便宜'],desc:''});
});
// 浮標
const FT={
  abo:{n:'阿波',tag:'抗浪穩定',tc:'#ff9c8f',desc:'圓球型中通浮標，乘浪穩定，不怕湧浪；訊號較鈍但真實，吃牢時下沉乾脆。',sens:70,wave:96,feat:'高反差雙色阿波球',base:90},
  eabo:{n:'電子阿波',tag:'夜釣抗浪',tc:'#ff8a5c',desc:'阿波球頂端裝上紅色電子燈，夜間看得清楚又不怕湧浪；訊號比電子浮標鈍一些。',sens:72,wave:94,feat:'紅色 LED 燈頂',base:250,led:'#ff4a2a'},
  long:{n:'長標',tag:'極度敏銳',tc:'#7fe7dc',desc:'細長標身，微小的頓點訊號無所遁形；怕風浪，標身容易被浪推得搖晃。',sens:95,wave:55,feat:'紅黃黑相間三色標目',base:130},
  short:{n:'短籤',tag:'平衡泛用',tc:'#ffc977',desc:'短小標身，抗浪能力好，下沉訊號直觀；新手老手都適合。',sens:82,wave:78,feat:'亮橘加粗標尾',base:110},
  cone:{n:'圓錐阿波',tag:'全遊動專用',tc:'#b9c7ff',desc:'圓錐造型入水順暢，搭配全遊動往底層探索，吃餌訊號柔和。',sens:76,wave:88,feat:'錐形雙色標身',base:150},
  elec:{n:'電子浮標',tag:'夜釣敏銳',tc:'#d4ff6a',desc:'棒狀標身頂端裝電子燈，夜裡浮標一點點下沉都看得到；抗浪普通，起風時燈會晃。',sens:86,wave:72,feat:'黃綠色 LED 標頭',base:280,sizes:[1,1.5,2,2.5,3,4,5,6],led:'#d4ff6a'}
};
for(const ty in FT){const T=FT[ty];T.sizes=T.sizes||[1,1.5,2,2.5,3,4,5,6];
  T.sizes.forEach(q=>add({id:`fl_${ty}_${sid(q)}`,cat:'float',sub:'float',grp:T.n,n:`${T.n} ${q}錢`,p:T.base+Math.round(q*35),ty,q,g:q*QIAN,sens:T.sens,wave:T.wave,win:.75+T.sens/100*1.15,

function load(){let o=null;try{o=JSON.parse(localStorage.getItem(SAVE)||'null')}catch(e){}
  const s=starter();
  if(!o||o.v!==2){try{const old=JSON.parse(localStorage.getItem('twiso1')||'null');if(old){if(old.m>s.m)s.m=Math.min(Math.round(old.m),30000);if(old.name)s.name=String(old.name).slice(0,12)}}catch(e){}return s}
  for(const k in s)if(o[k]===undefined)o[k]=s[k];
  for(const k of SLOTS.map(x=>x[0]))if(!(k in o.eq))o.eq[k]=null;
  for(const k in o.inv)if(!IT[k]||!(o.inv[k]>0))delete o.inv[k];
  for(const k in o.lm)if(!o.inv[k])delete o.lm[k];
  for(const k in o.eq)if(o.eq[k]&&(!IT[o.eq[k]]||!o.inv[o.eq[k]]))o.eq[k]=null;
  o.fish=(o.fish||[]).filter(f=>FISH[f.k]);
  return o}
let S=load();

const WXN=['晴','多雲','陰天','小雨','強風'];
function env(){
  const gt=Date.now()/60000, gh=gt%24, ph=gt/12.42*Math.PI*2;
  const tide=(Math.sin(ph)+1)/2, rise=Math.cos(ph)>0, flow=Math.abs(Math.cos(ph));
  const slot=Math.floor(gt/3), r=hash(slot), r2=hash(slot*7+3);
  const month=new Date().getMonth()+1, monsoon=month>=10||month<=3;
  let wx=r<.34?0:r<.56?1:r<.7?2:r<.84?3:4; if(monsoon&&r2<.22)wx=4;
  const wind=Math.round(([2,3,4,5,11][wx]+r2*3)*10)/10;
  const a=(gh-6)/12*Math.PI, el=Math.sin(a), L=clamp(el*1.6+.25,0,1), vis=L*(1-[0,.1,.35,.45,.35][wx]);
  return{gh,tide,rise,flow,wx,wind,wdir:monsoon?'東北':'西南',wxn:wx===4?(monsoon?'東北季風':'西南強風'):WXN[wx],a,el,L,vis,dark:vis<.34,month,monsoon,
    night:gh>=18.6||gh<5.4,dusk:(gh>=16.5&&gh<18.6)||(gh>=5.4&&gh<7.5),lvl:(tide-.5)};
}
function depthAt(sp,d,e){let x=d;if(sp.type==='canal')x=Math.min(d,Math.max(4,sp.wide-d));const v=(typeof CUR!=='undefined'&&sp===CUR&&sp.type!=='sand')?Math.sin(PX*.07+sp.d0*3)*.7:0;return Math.max(.3,sp.d0+sp.sl*x+(e.tide-.5)*sp.tr+v)}

   釣組分析

function rig(){
  const g=eqI, rod=g('rod'),reel=g('reel'),main=g('main'),leader=g('leader'),float=g('float'),stopper=g('stopper'),bead=g('bead'),swivel=g('swivel'),hook=g('hook'),bait=g('bait');
  const sinks=['s1','s2','s3'].map(g).filter(Boolean), lure=!!(bait&&bait.cat==='lure');
  const sinkG=sinks.reduce((a,s)=>a+s.g,0), E=[],W=[], ll=S.cfg.ll, tana=S.cfg.tana;
  if(!rod)E.push(['rod','還沒裝上釣竿']); if(!reel)E.push(['reel','還沒裝上捲線器']); if(!main)E.push(['main','捲線器上沒有母線']);
  if(main&&!((S.lm[main.id]||0)>5))E.push(['main','母線剩不到 5m，到釣具行補線']);
  if(!bait)E.push(['bait','沒有餌或路亞，到釣具行補貨']);
  if(!lure){
    if(!float)E.push(['float','浮標釣需要浮標']); if(!leader)E.push(['leader','浮標釣需要子線']); if(!hook)E.push(['hook','浮標釣需要鉤']);
    if(leader&&!((S.lm[leader.id]||0)>=ll))E.push(['leader',`子線只剩 ${f1(S.lm[leader.id]||0)}m，不夠綁 ${ll}m`]);
    if(float&&sinkG>float.g*1.05)E.push(['s1',`鉛共 ${f2(sinkG)}g，超過浮標浮力 ${f1(float.g)}g，浮標會被拉沉`]);
    else if(float&&sinkG<float.g*.35)W.push(['s1',`鉛只有浮力的 ${Math.round(sinkG/float.g*100)}%，浮標站不穩、餌下沉慢`]);
    if(!stopper)W.push(['stopper','沒裝浮標止＝全遊動，餌會一路沉到底']);
    else if(!bead)W.push(['bead','沒有止珠，浮標止容易被磨掉']);
    if(stopper&&ll>tana)W.push(['leader','子線比棚還長，鉛會碰不到位置']);
  }else{
    if(main&&main.mat==='pe'&&!leader)W.push(['leader','PE 直綁路亞，魚看得到線，也容易被磨斷']);
    if(float||sinks.length)W.push(['float','用路亞時，浮標和鉛不會用到']);
  }
  const cnt={};for(const k in S.eq){const id=S.eq[k];if(!id||!has(id))continue;if(lure&&['float','stopper','bead','s1','s2','s3','hook'].includes(k))continue;cnt[id]=(cnt[id]||0)+1}
  for(const id in cnt)if(cnt[id]>(S.inv[id]||0))E.push([null,`「${IT[id].n}」只有 ${S.inv[id]} 個，不夠裝 ${cnt[id]} 個位置`]);
  const parts=[];if(rod)parts.push(['rod',rod.kg,'竿子']);if(main)parts.push(['main',main.kg,'母線']);if(leader)parts.push(['leader',leader.kg,'子線']);
  if(!lure&&hook)parts.push(['hook',hook.kg,'鉤']);if(swivel)parts.push(['swivel',swivel.kg,'轉環']);
  if(main&&leader)parts.push(['knot',Math.round(Math.min(main.kg,leader.kg)*(swivel?.92:.85)*10)/10,'結點']);
  parts.sort((a,b)=>a[1]-b[1]); const weak=parts[0]||['none',0,'—'], limit=weak[1];
  if(main&&leader&&leader.kg>main.kg)W.push(['leader','子線比母線強，斷線時會從母線斷，整組都會損失']);
  if(rod&&main&&main.kg>rod.kg*1.4)W.push(['rod','母線比竿子強太多，遇到大魚可能折竿']);
  const onReel=reel&&main?Math.round(Math.min(S.lm[main.id]||0,reel.cap[1]*Math.pow(JP[reel.cap[0]][0]/main.d,2))):0;
  if(reel&&main&&onReel<(S.lm[main.id]||0)-1)W.push(['main',`捲線器只裝得下 ${onReel}m 這種母線`]);
  const drag=reel?Math.min(S.cfg.drag,reel.drag):0;
  if(limit&&drag>limit*.75)W.push(['reel',`煞車 ${f1(drag)}kg 接近線組強度 ${f1(limit)}kg，衝擊一來就斷`]);
  else if(limit&&drag<limit*.15)W.push(['reel','煞車太鬆，魚容易一路衝進障礙物']);
  const wt=lure?bait.g:(float?float.g:0)+sinkG;
  const rodFit=rod?(lure?(rod.lure?1:.72):(rod.lure?.85:1)):0;
  const wf=clamp(.45+.55*Math.min(1,wt/(rod?rod.opt:10)),.4,1), lf=main?(main.mat==='pe'?1.12:1.1-main.no*.03):1;
  const maxCast=rod?Math.round(rod.cast*rodFit*wf*lf):0;
  return{rod,reel,main,leader,float,stopper,bead,swivel,hook,bait,sinks,sinkG,lure,E,W,weak,limit,onReel,drag,maxCast,wt,ll,tana,ok:!E.length};
}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function noiseBuf(a,d){const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;return b}
function sfx(k){if(!S.snd)return;const a=ac();if(!a)return;const t=a.currentTime;
  try{
    if(k==='click'){const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=1900;g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.04);return}
    const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=noiseBuf(a,.8);src.connect(f).connect(g).connect(a.destination);
    if(k==='whoosh'){f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(500,t);f.frequency.exponentialRampToValueAtTime(2600,t+.32);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.4)}
    else if(k==='splash'){f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+.5)}
    else if(k==='snap'){f.type='highpass';f.frequency.value=2500;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12)}
    else if(k==='bite'){f.type='lowpass';f.frequency.value=260;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25)}
    else if(k==='coin'){src.disconnect();const o=a.createOscillator(),gg=a.createGain();o.type='triangle';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.08);gg.gain.setValueAtTime(.08,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(gg).connect(a.destination);o.start(t);o.stop(t+.32);return}
    src.start(t);src.stop(t+.8);
  }catch(e){}
}

function helpView(){return `<div class="slider"><div class="lab"><b>咬餌輔助</b><button class="ghost" data-assist style="height:40px">${S.assist?'開・有提示':'關・全靠自己'}</button></div><p>開：魚真正咬餌時跳出「揚竿！」、按鈕發亮並震動，水下視窗看得到魚影。關：沒有任何提示，只能自己盯浮標判斷，賣魚收入 +15%。</p></div>`+`<div class="help">

  <h4>4. 揚竿時機</h4><p>小魚試探時浮標只會輕點，這時揚竿會空竿、餌被吃掉。等畫面跳出「揚竿」、浮標真正沉下去再按。各魚咬法不同：黑鯛慢慢沉、鱸魚一口氣消失、午仔橫向拖走、白帶會讓浮標停頓上浮。</p>

  <h4>6. 補貨</h4><p>母線、子線用公尺計算，斷線就會變短，用完要到釣具行補一捲。鉤、鉛、浮標止、轉環也會在斷線時消耗。</p>

  <h4>鍵盤</h4><p>空白鍵＝主按鈕，B＝放線／次要按鈕，R＝理線，A／D＝沿堤走動，左右方向鍵＝調整方向。</p></div>`}

float d=length(cameraPosition-vW);gl_FragColor=vec4(mix(c,uFog,smoothstep(uFogN,uFogF,d)),1.);}`;
const SV=`varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const SF=`uniform vec3 uTop,uHor,uSunC,uSunDir;varying vec3 vD;void main(){float y=vD.y;vec3 c=mix(uHor,uTop,smoothstep(0.,.55,y));if(y<0.)c=uHor*.85;float s=max(dot(vD,uSunDir),0.);c+=uSunC*(pow(s,900.)*4.+pow(s,10.)*.35);gl_FragColor=vec4(c,1.);}`;

function makeTurbine(scale,glow){const T=THREE,g=new T.Group(),w=lam('#e9eef0');

function init3D(){

  if(!window.firebase||!window.FB_CONFIG)return null;
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(window.FB_CONFIG);
  const cred=await firebase.auth().signInAnonymously();const myId=cred.user.uid;
  const db=firebase.database(),base=db.ref('rooms/'+name),presRef=base.child('presence/'+myId),evRef=base.child('events');
  let mine={},peersV={},lastJSON='',pending=null,lastWrite=0,offset=0,errShown=false;const handlers={},seen=new Set();
  db.ref('.info/serverTimeOffset').on('value',x=>{offset=x.val()||0});
  base.child('presence').on('value',snap=>{peersV=snap.val()||{}});
  const init=await evRef.limitToLast(20).once('value');init.forEach(c=>{seen.add(c.key)});
  evRef.limitToLast(20).on('child_added',c=>{if(seen.has(c.key))return;seen.add(c.key);const v=c.val();if(!v||!v.topic)return;
    (handlers[v.topic]||[]).forEach(h=>{try{h({topic:v.topic,data:v.data,peer:v.peer,by:null,isMe:v.peer===myId,sameTab:v.peer===myId,kind:'viewer',guest:true})}catch(e){}})});
  const flush=()=>{pending=null;const j=JSON.stringify(mine);if(j===lastJSON)return;lastJSON=j;lastWrite=Date.now();
    presRef.set(Object.assign({},mine,{at:firebase.database.ServerValue.TIMESTAMP})).then(()=>{window.__fbErr=''}).catch(err=>{lastJSON='';window.__fbErr=String((err&&(err.code||err.message))||err);if(!errShown){errShown=true;toast('多人資料寫入失敗：'+window.__fbErr+'（請確認資料庫規則已發布）',6000)}})};
  db.ref('.info/connected').on('value',x=>{if(x.val()===true){presRef.onDisconnect().remove();lastJSON='';flush()}});
  setInterval(()=>{lastJSON='';flush()},10000);
  return{
    peers(){const out=[],now=Date.now()+offset;for(const id in peersV){const pr=peersV[id];if(!pr||typeof pr!=='object')continue;if(id!==myId&&pr.at&&now-pr.at>35000)continue;out.push({peer:id,by:null,isMe:id===myId,sameTab:id===myId,kind:'viewer',guest:true,presence:id===myId?mine:pr,updatedAt:pr.at||0})}
      if(!peersV[myId])out.push({peer:myId,by:null,isMe:true,sameTab:true,kind:'viewer',guest:true,presence:mine,updatedAt:Date.now()});return out},
    async presence(patch){for(const k in patch){if(patch[k]===null||patch[k]===undefined)delete mine[k];else mine[k]=patch[k]}
      if(Date.now()-lastWrite>400)flush();else if(!pending)pending=setTimeout(flush,400)},
    async emit(topic,data){const r=evRef.push();await r.set({topic,data:data??null,peer:myId,ts:firebase.database.ServerValue.TIMESTAMP});setTimeout(()=>r.remove().catch(()=>{}),30000)},
    on(topic,h){(handlers[topic]=handlers[topic]||[]).push(h);return()=>{handlers[topic]=(handlers[topic]||[]).filter(x=>x!==h)}},
    connected(){return true}
  }}
(async()=>{try{
  if(window.claude){const r=await claude.use('room');if(r)room=await r.join('tw-iso')}
  else if(window.firebase&&window.FB_CONFIG){try{room=await fbRoom('tw-iso')}catch(err){console.warn('Firebase',err);room=null;toast('多人連線失敗：請確認 Firebase 已啟用「匿名登入」，並貼上了資料庫規則',4500)}}
  if(room){room.on('catch',m=>{const d=m.data;if(!m.sameTab&&d&&typeof d==='object')feed(`${String(d.n||'釣友').slice(0,12)} 在${String(d.sp||'').slice(0,8)}釣到 ${String(d.f||'').slice(0,8)} ${f2(Number(d.w)||0)}kg`)});sendPresence(true)}
}catch(e){room=null}})();

/* =========================================================
   主迴圈
   ========================================================= */
function resize(){const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;if(R)R.setSize(w,h,false);
  if(G.map){G.map.cam.aspect=w/h;G.map.cam.updateProjectionMatrix()}if(G.spot){G.spot.cam.aspect=w/h;G.spot.cam.updateProjectionMatrix()}measureDock()}
window.addEventListener('resize',resize);
function placeLabels(cam){const w=innerWidth,h=innerHeight,v=new THREE.Vector3();
  for(const l of LBL){if(mode!=='map'){continue}v.set(l.x,l.y,l.z).project(cam);if(v.z>1||v.x<-1.2||v.x>1.2||v.y<-1.2||v.y>1.2){l.e.style.visibility='hidden';continue}l.e.style.visibility='';l.e.style.transform=`translate(${(v.x+1)/2*w}px,${(1-v.y)/2*h}px) translate(-50%,-100%)`}
  if(mode==='spot'&&G.spot)for(const o of Object.values(G.spot.oth).concat(G.spot.me?[G.spot.me]:[])){if(!o.wp)continue;v.copy(o.wp).project(cam);if(v.z>1||Math.abs(v.x)>1.2){o.lab.style.visibility='hidden';continue}o.lab.style.visibility='';o.lab.style.transform=`translate(${(v.x+1)/2*w}px,${(1-v.y)/2*h}px) translate(-50%,-100%)`}}
let last=performance.now(),t0=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000,e=env();
  if(mode==='spot'){if(keys.l&&(F.st==='idle'||F.st==='charge'))yaw=clamp(yaw+dt*.9,-.75,.75);if(keys.r&&(F.st==='idle'||F.st==='charge'))yaw=clamp(yaw-dt*.9,-.75,.75);
    const wd=walkDir||((keys.wr?1:0)-(keys.wl?1:0));if(wd&&F.st==='idle'){const lim=CUR.type==='sand'?80:60;PX=clamp(PX+wd*2.4*dt,-lim,lim)}
    step(dt);floatAnim(dt,t);chumTick(dt,e);if(CM.ch){CM.t+=dt;CM.pow=.5-.5*Math.cos(CM.t*Math.PI/.9)}if(holdP&&(F.st==='fight'||F.st==='retrieve')&&Math.floor(now/90)!==Math.floor((now-dt*1000)/90))sfx('click')}
  // 浪太大的危險
  if(mode==='spot'&&CUR&&CUR.type==='tetra'&&e.wx===4&&F.st!=='idle'){F.wv=(F.wv||0)+dt;if(F.wv>12){F.wv=0;if(Math.random()<.08){if(has('vest'))toast('大浪打上消波塊，救生衣保住了你');else if(F.r){const l=Math.round(S.m*.12);S.m-=l;lose('main');endCast(`大浪打上消波塊，你狼狽退回堤上，掉了 $${l} 和整組釣組`)}}}}
  if(has3D){update3D(dt,t,e);
    if(mode==='map'){const M=G.map,portrait=innerHeight>innerWidth,Hh=(portrait?165:108)*M.zoom;M.cam.position.lerp(new THREE.Vector3(M.tx,Hh,M.tz+Hh*.62),Math.min(1,dt*4));M.cam.lookAt(M.tx,0,M.tz);R.render(M.sc,M.cam);placeLabels(M.cam)}
    else if(G.spot){R.render(G.spot.sc,G.spot.cam);placeLabels(G.spot.cam)}}
  if(mode==='spot'){drawUW(e);sendPresence()}else sendPresence();
  hud(e);
  requestAnimationFrame(loop)}

/* 啟動 */
has3D=init3D();
if(!has3D){$('#fallback').hidden=false;$('#fallback').textContent='這台裝置無法顯示 3D 地圖。仍可從下方選單逛釣具行、配釣組，並從釣點清單進入釣位。';
  const card=$('#spotCard');card.hidden=false;card.innerHTML=`<h3>選擇釣點</h3><div class="row2" style="flex-wrap:wrap">${SPOTS.map(s=>`<button class="ghost" data-go="${s.id}">${s.n}</button>`).join('')}</div>`;$('#mapHint').hidden=true}
$('#cSnd').textContent='音效 '+(S.snd?'開':'關');
resize();hud(env(),true);
requestAnimationFrame(loop);
</script>
